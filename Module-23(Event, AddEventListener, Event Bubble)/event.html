<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Handler</title>
</head>
<body>
    <h1 id="page-title">Event Handler</h1>
    <button id="btn-update-title">Update title</button>
    <p id="user-info">No User</p>
    <button id="btn-login">Login</button><br><br><br>

    <!-- handle input text -->
    <p id="name">No name</p>
    <input id="input-name" type="text" placeholder="Your name">
    <button id="btn-update">Update</button>

    <script>
        // set event listener
        document.getElementById('btn-update')
            .addEventListener('click',
                function (){
                    // 2. Get the text from the input field
                    const nameInput = document.getElementById('input-name');
                    const name = nameInput.value;
                    // console.log(name);

                    // set name to paragraph tag
                    const nameP = document.getElementById('name');
                    nameP.innerText = name;
                }
            )
    </script>

    <script src="js/handler.js"></script>
</body>
</html>
