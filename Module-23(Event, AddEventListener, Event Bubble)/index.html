<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Events</title>
</head>
<body>
    <h1>DOM</h1>
    <!-- Option 1 for event handler -->
    <button onclick="console.log(10);">Click Me</button>
    <button onclick="console.log('Someone Clicked me');">Third Button</button>
    <input type="text">

    <br>
    <br>

    <!-- Option 2 for click event handler -->
    <button onclick="makeYellow()">Make Yellow</button>
    <button onclick="makeRed()">Make Red</button>

    <br> <br>
    <button id="btn-make-blue">Make Blue</button>
    <button id="btn-make-purple">Make Purple</button>

    <script>
        const btnMakePurple = document.getElementById('btn-make-purple');
        
        btnMakePurple.onclick = makePurple;

        function makePurple(){
            document.body.style.backgroundColor = 'purple';
        }
    </script>
    <script src="js/events.js"></script>
</body>
</html>
